# 50-sftp.conf - SFTP settings for the migrated UC SFTP target (RHEL 10).
# Install at /etc/ssh/sshd_config.d/50-sftp.conf. Loaded via the
# `Include /etc/ssh/sshd_config.d/*.conf` line near the top of the stock
# sshd_config, so directives here override later defaults.
#
# Derived from the reviewed RHEL 7 sshd_config (review branch). Validate
# after any edit:   sshd -t   then   systemctl reload sshd
#
# SCOPE: the RHEL 7 source ran plain SFTP with full-home accounts
# (drsbackup, sftpstorage) - no ChrootDirectory, no Match blocks. Nothing
# here is strictly required to reproduce that; the stock RHEL 10
# `Subsystem sftp` already works. This file exists to hold any per-account
# SFTP hardening you choose to add, and to document what was deliberately
# NOT carried over.

# --- Do NOT redefine Subsystem here ---
# Stock RHEL 10 sshd_config already sets:
#   Subsystem sftp /usr/libexec/openssh/sftp-server
# Declaring it again makes sshd fail: "Subsystem 'sftp' already defined".
# Switch to internal-sftp only inside a Match block (below), never globally.

# --- Do NOT carry over the RHEL 7 host's custom SFTP cipher-suite block ---
# The source set Ciphers/MACs/KexAlgorithms with aes*-cbc, 3des-cbc,
# hmac-sha1 and diffie-hellman-group1-sha1. Those are STIG findings and
# several are non-FIPS. On RHEL 10 crypto is governed by crypto-policies,
# not hardcoded lines here. If a legacy client truly needs an old
# algorithm, use a scoped subpolicy - see
# templates/crypto-policies/LEGACY-SFTP-KEX.pmod. Never add Ciphers/MACs/
# KexAlgorithms lines to this file.

# --- OPTIONAL: lock SFTP service accounts to SFTP-only + chroot ---
# The source gave these accounts a real shell. To restrict them to SFTP
# with no shell and a chroot (recommended for a hardened target): create a
# group, add the accounts, uncomment below, and make ChrootDirectory
# root-owned, 0755, not writable by the user. This CHANGES behavior -
# drsbackup currently runs lftp/scripts from its home for CDR/CMR pulls, so
# confirm the DRS workflow still works before enabling.
#
#Match Group sftponly
#    ChrootDirectory %h
#    ForceCommand internal-sftp
#    AllowTcpForwarding no
#    X11Forwarding no
#    PermitTTY no
