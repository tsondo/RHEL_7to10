# 10-cisco-tls.conf - RHEL 10 rsyslog drop-in for the UC syslog receiver.
# Install at /etc/rsyslog.d/10-cisco-tls.conf.
#
# Replaces the RHEL 7 rsyslog.conf's plaintext UDP:514 reception with
# TLS-over-TCP on 6514 (ossl driver), and re-implements the Cisco content
# rules from the reviewed RHEL 7 config in RainerScript.
#
# Prereqs (do these first):
#   * Certs in place (restore's `certs` step, or install by hand) at the
#     paths in the global() block below.
#   * Log target dirs exist, root-owned, SELinux var_log_t:
#       install -d -m 0750 -o root -g root /var/log/cisco /var/log/iptables
#       restorecon -Rv /var/log/cisco /var/log/iptables
#   * firewalld:
#       firewall-cmd --permanent --add-port=6514/tcp && firewall-cmd --reload
#   * Validate:  rsyslogd -N1   then   systemctl restart rsyslog
#
# UTC NOTE: the template stamps the literal string "UTC". That is only
# truthful if the host clock is UTC (timedatectl set-timezone UTC). Set it,
# or drop the "UTC" literal from the template string.
#
# SEGREGATION NOTE: this binds to the default ruleset, so remote router
# messages flow through the same rules as local logs (matching the RHEL 7
# behavior). To keep remote router logs separate, give the input its own
# `ruleset=` and move the rules into that ruleset.

# --- TLS-secured TCP reception (was: $ModLoad imudp / $UDPServerRun 514) ---
module(load="imtcp"
       StreamDriver.Name="ossl"
       StreamDriver.Mode="1"               # 1 = TLS required
       StreamDriver.AuthMode="x509/name"   # mutual TLS; peers pinned below
       PermittedPeer=["router1.example.mil","router2.example.mil"])

# For server-auth-only devices that present NO client cert, use
# StreamDriver.AuthMode="anon" above and delete the PermittedPeer line.

global(
    DefaultNetstreamDriver="ossl"
    DefaultNetstreamDriverCAFile="/etc/pki/rsyslog/ca.pem"
    DefaultNetstreamDriverCertFile="/etc/pki/rsyslog/server-cert.pem"
    DefaultNetstreamDriverKeyFile="/etc/pki/rsyslog/server-key.pem"
)

input(type="imtcp" port="6514")

# --- Log format carried over from the RHEL 7 CustomFormat (UTC) ---
template(name="CiscoUTCFormat" type="string"
    string="%timegenerated:::date-year%-%timegenerated:::date-month%-%timegenerated:::date-day% %timegenerated:::date-hour%:%timegenerated:::date-minute%:%timegenerated:::date-second% UTC %HOSTNAME% %syslogtag% %msg%\n")

# --- Cisco content filters (was: :msg, contains ... & stop) ---
if ($msg contains "UC_AUDITLOG") or ($msg contains "UC_LOGIN") then {
    action(type="omfile" file="/var/log/cisco/cisco-uc.log" template="CiscoUTCFormat")
    stop
}
if $msg contains "IPACCESSLOG" then {
    action(type="omfile" file="/var/log/cisco/cisco.log" template="CiscoUTCFormat")
    stop
}
if $msg contains "iptables" then {
    action(type="omfile" file="/var/log/iptables/iptables.log" template="CiscoUTCFormat")
    stop
}

# --- Cisco gateway facility rules (was: local7.debug -> cisco.log,
#     local7.* -> boot.log) ---
if prifilt("local7.*") then {
    action(type="omfile" file="/var/log/cisco/cisco.log" template="CiscoUTCFormat")
    action(type="omfile" file="/var/log/boot.log")
}
