# 10-cisco-udp514.conf - INTERIM plaintext UDP:514 receiver.
# Install at /etc/rsyslog.d/10-cisco-udp514.conf.
#
# A short-lived bridge for when routers cannot yet send over TLS/6514 (e.g.
# the network admin still has to enroll certs). It reproduces the RHEL 7
# server's plaintext UDP:514 reception and the same Cisco routing rules, so
# logs keep landing in /var/log/cisco while you wait.
#
# REMOVE this file and close 514/udp the moment the TLS receiver
# (10-cisco-tls.conf, port 6514) is live. Plaintext syslog on 514 open
# permanently is a STIG finding - this is interim only.
#
# Prereqs (same as the TLS drop-in, minus the certs):
#   * /var/log/cisco and /var/log/iptables exist (root:root, var_log_t)
#   * firewall: sudo firewall-cmd --add-port=514/udp   (runtime is fine)
#   * validate: rsyslogd -N1  then  systemctl restart rsyslog
#
# UTC NOTE: the template stamps the literal "UTC" - only truthful if the
# host clock is UTC (timedatectl set-timezone UTC).

module(load="imudp")
input(type="imudp" port="514")

template(name="CiscoUTCFormat" type="string"
    string="%timegenerated:::date-year%-%timegenerated:::date-month%-%timegenerated:::date-day% %timegenerated:::date-hour%:%timegenerated:::date-minute%:%timegenerated:::date-second% UTC %HOSTNAME% %syslogtag% %msg%\n")

if ($msg contains "UC_AUDITLOG") or ($msg contains "UC_LOGIN") then {
    action(type="omfile" file="/var/log/cisco/cisco-uc.log" template="CiscoUTCFormat")
    stop
}
if $msg contains "IPACCESSLOG" then {
    action(type="omfile" file="/var/log/cisco/cisco.log" template="CiscoUTCFormat")
    stop
}
if $msg contains "iptables" then {
    action(type="omfile" file="/var/log/iptables/iptables.log" template="CiscoUTCFormat")
    stop
}
if prifilt("local7.*") then {
    action(type="omfile" file="/var/log/cisco/cisco.log" template="CiscoUTCFormat")
    action(type="omfile" file="/var/log/boot.log")
}
